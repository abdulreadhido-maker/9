<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torrema | برمجة احترافية</title>
<style>
:root { --primary-gradient: linear-gradient(45deg, #ff00cc, #3333ff, #00ffff, #ff00cc); --bg-dark: #0a0a0c; --card-bg: rgba(25, 25, 28, 0.7); --border-color: rgba(255, 0, 204, 0.2); --text-sec: #94a3b8; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: var(--bg-dark); color: white; padding: 40px 5%; min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; }
.box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; margin-bottom: 25px; }
h1 { font-size: 32px; margin-bottom: 20px; text-align: center; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
h2 { color: #ff00cc; font-size: 20px; margin-bottom: 15px; }
.terminal { background: #050508; border: 1px solid #ff00cc; border-radius: 8px; padding: 20px; color: #00ff00; min-height: 80px; margin-top: 15px; font-family: monospace; }
.action-btn { background: #ff00cc; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
.back-btn { display: inline-block; padding: 12px 35px; background: var(--primary-gradient); border: none; border-radius: 50px; color: white; text-decoration: none; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>💻 محاكي البرمجة النظيفة والأمان</h1>
  <div class="box">
    <h2>🛡️ لوحة اختبار جودة الأكواد وحمايتها</h2>
    <button class="action-btn" onclick="check()">🧪 اضغط لبدء فحص أمان الكود</button>
    <div class="terminal" id="out">> مستعد لبدء الفحص...</div>
  </div>
  <center><a href="index.html" class="back-btn">← العودة للرئيسية</a></center>
</div>
<script>
function check() { document.getElementById('out').innerText = "> جاري الفحص...\n> [نجاح]: الكود مشفر ومحمي 100% ضد الثغرات."; }
</script>
</body>
</html>
