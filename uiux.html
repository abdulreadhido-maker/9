<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torrema | واجهات UI/UX</title>
<style>
:root { --primary-gradient: linear-gradient(45deg, #ff00cc, #3333ff, #00ffff, #ff00cc); --bg-dark: #0a0a0c; --card-bg: rgba(25, 25, 28, 0.7); --border-color: rgba(51, 51, 255, 0.2); --text-sec: #94a3b8; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: var(--bg-dark); color: white; padding: 40px 5%; min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; }
.box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; margin-bottom: 25px; }
h1 { font-size: 32px; margin-bottom: 20px; text-align: center; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
h2 { color: #3333ff; font-size: 20px; margin-bottom: 15px; }
.compare { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
.card-ui { flex: 1; background: #111116; padding: 20px; border-radius: 12px; text-align: center; border-top: 4px solid #22c55e; }
.back-btn { display: inline-block; padding: 12px 35px; background: var(--primary-gradient); border: none; border-radius: 50px; color: white; text-decoration: none; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>✨ هندسة واجهات المبيعات وتجربة المستخدم</h1>
  <div class="box">
    <h2>👀 شاهد التغيير المريح للعين في تصاميمنا</h2>
    <div class="compare">
      <div class="card-ui">
        <h3>✅ تصميم Torrema المحترف</h3>
        <p style="font-size:14px; color:var(--text-sec); margin-top:10px;">ألوان متناسقة، نصوص مريحة، تضمن بقاء الزائر أطول فترة داخل موقعك الحقيقي.</p>
      </div>
    </div>
  </div>
  <center><a href="index.html" class="back-btn">← العودة للرئيسية</a></center>
</div>
</body>
</html>
