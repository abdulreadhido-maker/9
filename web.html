<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torrema | تصميم مواقع</title>
<style>
:root { --primary-gradient: linear-gradient(45deg, #ff00cc, #3333ff, #00ffff, #ff00cc); --bg-dark: #0a0a0c; --card-bg: rgba(25, 25, 28, 0.7); --border-color: rgba(0, 255, 255, 0.2); --text-sec: #94a3b8; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: var(--bg-dark); color: white; padding: 40px 5%; min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; }
.box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; margin-bottom: 25px; }
h1 { font-size: 32px; margin-bottom: 20px; text-align: center; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
h2 { color: #00ffff; font-size: 20px; margin-bottom: 15px; }
p { color: var(--text-sec); line-height: 1.6; font-size: 15px; }
select { width: 100%; padding: 12px; background: #13131a; border: 1px solid var(--border-color); border-radius: 8px; color: white; margin-top: 10px; }
.result-box { background: rgba(0, 255, 255, 0.1); border: 1px dashed #00ffff; padding: 20px; border-radius: 8px; text-align: center; margin-top: 20px; }
.price-tag { font-size: 28px; color: #00ffff; font-weight: bold; }
.back-btn { display: inline-block; padding: 12px 35px; background: var(--primary-gradient); border: none; border-radius: 50px; color: white; text-decoration: none; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>🌐 مساعد تخطيط وتصميم المواقع</h1>
  <div class="box">
    <h2>🧮 حاسبة الميزانية والوقت التقديرية</h2>
    <p>اختر حجم موقعك لحساب السعر فوراً:</p>
    <select id="pages" onchange="calc()">
      <option value="300">صفحة واحدة تعريفية - $300</option>
      <option value="600">موقع شركات متكامل - $600</option>
      <option value="1100">متجر إلكتروني ضخم - $1100</option>
    </select>
    <div class="result-box">
      <div>التكلفة التقديرية:</div>
      <div class="price-tag" id="total-price">$300</div>
    </div>
  </div>
  <center><a href="index.html" class="back-btn">← العودة للرئيسية</a></center>
</div>
<script>
function calc() { document.getElementById('total-price').innerText = "$" + document.getElementById('pages').value; }
</script>
</body>
</html>
