<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torrema</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
  scroll-behavior:smooth;
}

body{
  background:#050816;
  color:white;
  overflow-x:hidden;
}

/* خلفية تقنية */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle, rgba(0,255,255,0.1) 1px, transparent 1px);
  background-size:50px 50px;
  animation:move 25s linear infinite;
  z-index:-1;
}

@keyframes move{
  from{transform:translate(0,0);}
  to{transform:translate(-100px,-100px);}
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  border-bottom:1px solid cyan;
  z-index:1000;
}

nav h1{
  color:cyan;
  font-size:26px;
}

nav a{
  color:white;
  margin:0 10px;
  text-decoration:none;
  transition:0.3s;
}

nav a:hover{
  color:cyan;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1{
  font-size:70px;
  color:cyan;
  text-shadow:0 0 20px cyan;
}

.hero p{
  color:#aaa;
  margin:15px 0;
}

/* زر */
button{
  padding:12px 25px;
  background:cyan;
  border:none;
  border-radius:25px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px cyan;
}

/* أقسام */
section{
  padding:120px 20px;
  text-align:center;
}

.card{
  background:#0f172a;
  border:1px solid cyan;
  padding:20px;
  margin:15px;
  border-radius:15px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 20px cyan;
}

/* زر رجوع */
#topBtn{
  position:fixed;
  bottom:20px;
  left:20px;
  display:none;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <h1>Torrema</h1>
  <div>
    <a href="#home">الرئيسية</a>
    <a href="#services">الخدمات</a>
    <a href="#gallery">المعرض</a>
    <a href="#contact">التواصل</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero" id="home">
  <div>
    <h1 id="title">Torrema</h1>
    <p>موقع إلكتروني تقني بتصميم داكن ومستقبلي</p>
    <button onclick="start()">ابدأ الآن</button>
  </div>
</section>

<!-- SERVICES -->
<section id="services">
  <h2>الخدمات</h2>
  <div class="card">تصميم مواقع حديثة</div>
  <div class="card">برمجة احترافية</div>
  <div class="card">تجربة مستخدم UI/UX</div>
</section>

<!-- GALLERY -->
<section id="gallery">
  <h2>المعرض الإلكتروني</h2>
  <div class="card">صور تقنية حديثة</div>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2>التواصل</h2>
  <div class="card">
    <input placeholder="الاسم" style="width:100%;padding:10px;margin:10px 0;">
    <input placeholder="البريد" style="width:100%;padding:10px;margin:10px 0;">
    <textarea placeholder="رسالتك" style="width:100%;padding:10px;margin:10px 0;"></textarea>
    <button>إرسال</button>
  </div>
</section>

<button id="topBtn" onclick="scrollTopPage()">↑</button>

<script>
function start(){
  alert("مرحباً بك في Torrema 🚀");
}

/* زر الرجوع للأعلى */
window.onscroll = function(){
  let btn = document.getElementById("topBtn");
  if(document.documentElement.scrollTop > 300){
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
};

function scrollTopPage(){
  window.scrollTo({top:0, behavior:"smooth"});
}

/* تأثير كتابة */
let text = "Torrema";
let i = 0;
document.getElementById("title").innerHTML = "";

function typing(){
  if(i < text.length){
    document.getElementById("title").innerHTML += text[i];
    i++;
    setTimeout(typing,150);
  }
}

typing();
</script>

</body>
</html>
