<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Torrema</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
      font-family:'Cairo',sans-serif;
    }

    :root{
      --bg:#050816;
      --card:#0f172a;
      --cyan:#00e5ff;
      --cyan2:#06b6d4;
      --white:#ffffff;
      --gray:#94a3b8;
    }

    body{
      background:var(--bg);
      color:white;
      overflow-x:hidden;
    }

    /* خلفية متحركة */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      background:
      radial-gradient(circle at center,
      rgba(0,229,255,0.15),
      transparent 30%),
      repeating-linear-gradient(
      90deg,
      rgba(0,229,255,.05) 0px,
      rgba(0,229,255,.05) 1px,
      transparent 1px,
      transparent 80px
      ),
      repeating-linear-gradient(
      0deg,
      rgba(0,229,255,.05) 0px,
      rgba(0,229,255,.05) 1px,
      transparent 1px,
      transparent 80px
      );

      z-index:-1;
      animation:bgMove 15s linear infinite;
    }

    @keyframes bgMove{
      from{
        transform:translate(0,0);
      }
      to{
        transform:translate(-80px,-80px);
      }
    }

    /* NAVBAR */

    nav{
      position:fixed;
      top:0;
      right:0;
      width:100%;
      z-index:999;
      backdrop-filter:blur(15px);
      background:rgba(0,0,0,.45);
      border-bottom:1px solid rgba(0,229,255,.2);
    }

    .nav-container{
      max-width:1300px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px;
    }

    .logo{
      font-size:32px;
      font-weight:900;
      color:var(--cyan);
      text-shadow:0 0 20px var(--cyan);
      letter-spacing:3px;
    }

    .nav-links{
      display:flex;
      gap:30px;
      list-style:none;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      transition:.3s;
      position:relative;
    }

    .nav-links a::after{
      content:"";
      position:absolute;
      bottom:-6px;
      right:0;
      width:0%;
      height:2px;
      background:var(--cyan);
      transition:.3s;
    }

    .nav-links a:hover{
      color:var(--cyan);
    }

    .nav-links a:hover::after{
      width:100%;
    }

    /* HERO */

    .hero{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:120px 20px;
      position:relative;
    }

    .hero-content{
      max-width:900px;
      animation:fadeUp 1s ease;
    }

    .hero h1{
      font-size:85px;
      margin-bottom:20px;
      color:var(--cyan);
      text-shadow:
      0 0 20px var(--cyan),
      0 0 60px rgba(0,229,255,.5);
    }

    .hero p{
      font-size:24px;
      color:#d1d5db;
      line-height:2;
      margin-bottom:40px;
    }

    .hero-buttons{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .btn{
      padding:16px 36px;
      border:none;
      border-radius:60px;
      font-size:18px;
      cursor:pointer;
      transition:.4s;
      font-weight:700;
    }

    .btn-primary{
      background:var(--cyan);
      color:black;
      box-shadow:0 0 25px rgba(0,229,255,.5);
    }

    .btn-primary:hover{
      transform:translateY(-5px) scale(1.05);
      box-shadow:0 0 40px rgba(0,229,255,.9);
    }

    .btn-outline{
      background:transparent;
      color:var(--cyan);
      border:2px solid var(--cyan);
    }

    .btn-outline:hover{
      background:var(--cyan);
      color:black;
      transform:translateY(-5px);
    }

    /* SERVICES */

    .services{
      padding:120px 20px;
    }

    .section-title{
      text-align:center;
      font-size:50px;
      margin-bottom:70px;
      color:var(--cyan);
    }

    .cards{
      max-width:1300px;
      margin:auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:30px;
    }

    .card{
      background:rgba(15,23,42,.7);
      border:1px solid rgba(0,229,255,.2);
      border-radius:30px;
      padding:40px;
      transition:.5s;
      backdrop-filter:blur(15px);
      position:relative;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
      135deg,
      rgba(0,229,255,.15),
      transparent
      );
      opacity:0;
      transition:.5s;
    }

    .card:hover::before{
      opacity:1;
    }

    .card:hover{
      transform:translateY(-10px);
      border-color:var(--cyan);
      box-shadow:0 0 35px rgba(0,229,255,.25);
    }

    .card h3{
      color:var(--cyan);
      margin-bottom:20px;
      font-size:28px;
    }

    .card p{
      color:var(--gray);
      line-height:2;
    }

    /* GALLERY */

    .gallery{
      padding:120px 20px;
    }

    .gallery-grid{
      max-width:1300px;
      margin:auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:25px;
    }

    .gallery-item{
      overflow:hidden;
      border-radius:25px;
      border:1px solid rgba(0,229,255,.2);
      position:relative;
    }

    .gallery-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:.6s;
      display:block;
    }

    .gallery-item:hover img{
      transform:scale(1.1) rotate(2deg);
    }

    /* CONTACT */

    .contact{
      padding:120px 20px;
    }

    .contact-box{
      max-width:800px;
      margin:auto;
      background:rgba(15,23,42,.8);
      border:1px solid rgba(0,229,255,.2);
      border-radius:30px;
      padding:50px;
      backdrop-filter:blur(20px);
    }

    .contact form{
      display:grid;
      gap:20px;
    }

    .input{
      background:#111827;
      border:1px solid rgba(0,229,255,.2);
      padding:18px;
      border-radius:18px;
      color:white;
      font-size:16px;
      outline:none;
      transition:.3s;
    }

    .input:focus{
      border-color:var(--cyan);
      box-shadow:0 0 15px rgba(0,229,255,.3);
    }

    textarea{
      resize:none;
      min-height:180px;
    }

    /* FOOTER */

    footer{
      padding:30px;
      text-align:center;
      color:#94a3b8;
      border-top:1px solid rgba(0,229,255,.1);
    }

    /* SCROLL TOP */

    .scroll-top{
      position:fixed;
      left:20px;
      bottom:20px;
      width:55px;
      height:55px;
      border:none;
      border-radius:50%;
      background:var(--cyan);
      color:black;
      font-size:22px;
      cursor:pointer;
      display:none;
      z-index:999;
      transition:.3s;
      box-shadow:0 0 20px rgba(0,229,255,.5);
    }

    .scroll-top:hover{
      transform:translateY(-5px);
    }

    /* ANIMATION */

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(50px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .hidden{
      opacity:0;
      transform:translateY(60px);
      transition:1s;
    }

    .show{
      opacity:1;
      transform:translateY(0);
    }

    /* MOBILE */

    @media(max-width:768px){

      .hero h1{
        font-size:55px;
      }

      .hero p{
        font-size:18px;
      }

      .nav-links{
        gap:15px;
        font-size:14px;
      }

      .section-title{
        font-size:38px;
      }

      .contact-box{
        padding:30px;
      }

    }

  </style>
</head>
<body>
